{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Painel de Dias Compensatórios</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Funcionário</th>
        <th>Dias Pendentes</th>
        <th>Aplicar</th>
      </tr>
    </thead>
    <tbody>
      {% for emp in employees %}
      <tr>
        <td>{{ emp.name }}</td>
        <td>{{ emp.pending_days }}</td>
        <td>
          <form method="post" class="form-inline">
            {% csrf_token %}
            <input type="hidden" name="employee_id" value="{{ emp.id }}">
            <input type="number"
                   name="apply_days"
                   min="1"
                   max="{{ emp.pending_days }}"
                   value="1"
                   class="form-control form-control-sm mr-2"
                   style="width: 80px;">
            <button type="submit" class="btn btn-success btn-sm">Aplicar</button>
          </form>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="3">Nenhum dia compensatório pendente.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
