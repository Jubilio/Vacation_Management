{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Atualizar Pedido de Férias para {{ vacation.employee.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Atualizar</button>
        <a href="{% url 'vacation_manage' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
